[project]
name = "ultraarm-smartphone-endeffector"
version = "0.1.0"
description = "ultraArm P340 用スマホホルダーアダプタの CAD モデル"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cadquery>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
